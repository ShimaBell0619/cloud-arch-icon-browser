name: Temporary docs cleanup

on:
  push:
    branches:
      - docs/cleanup-obsolete

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: docs/cleanup-obsolete

      - name: Apply reference cleanup
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_required(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Expected text not found in {path}: {old[:80]!r}")
              p.write_text(text.replace(old, new))

          replace_required(
              "DESIGN.md",
              "The operational setup is documented in `docs/PAGES_PREVIEW.md`.",
              "The operational and visual-review setup is documented in `docs/UI_REVIEW.md`.",
          )
          replace_required(
              "DESIGN.md",
              "- `docs/RELEASE.md`: release and compatibility operations.\n- `docs/PAGES_PREVIEW.md`: GitHub Pages UI-preview setup and operational boundary.\n- `docs/V0.2.0_VERIFICATION.md`: release-specific `v0.2.0` verification record.\n- `LICENSE`: MIT license for project code.",
              "- `docs/RELEASE.md`: release and compatibility operations.\n- `docs/UI_REVIEW.md`: browser UI review and GitHub Pages preview operations.\n- `LICENSE`: MIT license for project code.",
          )
          replace_required(
              "CONTRIBUTING.md",
              "Core fixtures are generated in memory from project-owned shapes; do not replace them with Microsoft assets. See the [core integration notes](./docs/icon-package-core.md).",
              "Core fixtures are generated in memory from project-owned shapes; do not replace them with Microsoft assets.",
          )

          release_path = Path("docs/RELEASE.md")
          release = release_path.read_text()
          release, count = re.subn(
              r"\nRelease-specific verification records may live under `docs/`; the `v0\.2\.0` record is \[`V0\.2\.0_VERIFICATION\.md`\]\(\./V0\.2\.0_VERIFICATION\.md\)\.\n\n## Normal release flow",
              "\n## Normal release flow",
              release,
              count=1,
          )
          if count != 1:
              raise SystemExit("Could not remove v0.2.0 verification-record reference")

          replacement = (
              "## Release-specific product gates\n\n"
              "A Changesets Release PR is not sufficient evidence by itself that a feature release is ready. "
              "When an Epic or release-polish Issue defines additional acceptance criteria, complete those gates before merging the release PR. "
              "Keep release-specific evidence in the relevant Issue, PR, or release notes rather than a permanent version-specific runbook under `docs/`.\n\n"
              "The repository-wide rule remains: release PR merge requires explicit maintainer instruction; do not enable or perform automatic merge merely because CI is green.\n\n"
              "## Trusted Publishing contract"
          )
          release, count = re.subn(
              r"## Release-specific product gates\n\n.*?\n\n## Trusted Publishing contract",
              replacement,
              release,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit("Could not normalize release-specific product gates")
          release_path.write_text(release)

          for obsolete in (
              "docs/PAGES_PREVIEW.md",
              "docs/V0.2.0_VERIFICATION.md",
              "docs/icon-package-core.md",
          ):
              path = Path(obsolete)
              if path.exists():
                  path.unlink()
          PY

      - name: Commit generated cleanup
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "No cleanup changes remain."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: remove obsolete documentation"
          git push origin HEAD:docs/cleanup-obsolete
