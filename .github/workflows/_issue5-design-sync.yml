name: Issue 5 design scope sync

on:
  push:
    branches: [chore/issue-5-release-readiness]
    paths:
      - ".github/workflows/_issue5-design-sync.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chore/issue-5-release-readiness
      - name: Resolve final npm identity in design contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('DESIGN.md')
          s = p.read_text()
          replacements = {
            '- npm package will be scoped, for example `@<npm-scope>/cloud-arch-icon-browser`.': '- npm package name: `@shimabell0619/cloud-arch-icon-browser`.',
            '- Exact npm scope is intentionally unresolved until publication setup.': '- npm scope: `@shimabell0619`.',
            'Planned usage:\n\n```bash\nnpx @<npm-scope>/cloud-arch-icon-browser\n```': 'Supported usage:\n\n```bash\nnpx @shimabell0619/cloud-arch-icon-browser\n```',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'missing expected DESIGN.md text: {old}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit design contract update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DESIGN.md
          git commit -m "docs: resolve npm package identity"
          git pull --rebase origin chore/issue-5-release-readiness
          git push origin HEAD:chore/issue-5-release-readiness
