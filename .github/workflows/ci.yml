name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    name: Foundation checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      code_changed: ${{ steps.changes.outputs.code_changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect docs-only changes
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
          elif [[ "$EVENT_NAME" == "push" ]]; then
            base="$BEFORE_SHA"
          else
            echo "code_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            echo "code_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          code_changed=false
          while IFS= read -r path; do
            if [[ "$path" == *.md || "$path" == docs/* ]]; then
              continue
            fi
            code_changed=true
            break
          done < <(git diff --name-only "$base" "$HEAD_SHA")

          echo "code_changed=$code_changed" >> "$GITHUB_OUTPUT"

      - name: Docs-only change
        if: steps.changes.outputs.code_changed == 'false'
        run: echo "Documentation-only change detected; full CI checks are not required."

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.changes.outputs.code_changed == 'true'
        with:
          node-version-file: .node-version
          cache: npm
      - if: steps.changes.outputs.code_changed == 'true'
        run: npm ci
      - if: steps.changes.outputs.code_changed == 'true'
        run: npm run check
      - if: steps.changes.outputs.code_changed == 'true'
        run: npm run typecheck
      - if: steps.changes.outputs.code_changed == 'true'
        run: npm test
      - if: steps.changes.outputs.code_changed == 'true'
        run: npm run build
      - if: steps.changes.outputs.code_changed == 'true'
        run: npm run test:cli-smoke
      - if: steps.changes.outputs.code_changed == 'true'
        run: node scripts/cli-server-smoke.mjs

  cli-smoke:
    name: CLI smoke (${{ matrix.os }})
    needs: foundation
    if: needs.foundation.outputs.code_changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:cli-smoke
