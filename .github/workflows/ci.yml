name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-verify:
    name: Shared Web verification
    uses: ShimaBell0619/web-app-foundation/.github/workflows/web-ci.yml@83c06f73aa21bdd9f1d4fac2fdb2b25d69e5c365
    with:
      node_version_file: .node-version
      cache_dependency_path: package-lock.json
      run_check: true
      run_typecheck: true
      run_test: true
      run_e2e: false
    permissions:
      contents: read

  app-change-scope:
    name: App-specific change scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code_changed: ${{ steps.changes.outputs.code_changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect docs-only changes
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          mark_code_changed() {
            echo "code_changed=true" >> "$GITHUB_OUTPUT"
          }

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
          elif [[ "$EVENT_NAME" == "push" ]]; then
            base="$BEFORE_SHA"
          else
            mark_code_changed
            exit 0
          fi

          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            mark_code_changed
            exit 0
          fi

          if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            mark_code_changed
            exit 0
          fi

          if ! changed="$(git diff --name-status --no-renames "$base" "$HEAD_SHA")"; then
            mark_code_changed
            exit 0
          fi

          code_changed=false
          while IFS=$'\t' read -r status path; do
            if [[ -z "$path" ]]; then
              continue
            fi

            if [[ "$path" == docs/* || ( "$path" != */* && "$path" == *.md ) ]]; then
              continue
            fi

            code_changed=true
            break
          done <<< "$changed"

          echo "code_changed=$code_changed" >> "$GITHUB_OUTPUT"

  app-smoke:
    name: Application CLI/package validation
    needs: app-change-scope
    if: needs.app-change-scope.outputs.code_changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:cli-smoke
      - run: node scripts/cli-server-smoke.mjs
      - run: npm run test:cli-package-smoke
      - run: npm run verify:package

  release-readiness:
    name: Release readiness gate
    needs: app-change-scope
    if: needs.app-change-scope.outputs.code_changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run verify:release-ready

  browser-e2e:
    name: Browser E2E / a11y / visual
    needs: app-change-scope
    if: needs.app-change-scope.outputs.code_changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Create project-owned E2E fixtures
        run: |
          python3 scripts/ui-review/create_fixture.py /tmp/cloud-arch-icon-browser-e2e-fixture.zip
          python3 scripts/ui-review/create_fixture.py /tmp/cloud-arch-icon-browser-preview-performance-fixture.zip 160
      - name: Run Playwright suite
        env:
          E2E_FIXTURE: /tmp/cloud-arch-icon-browser-e2e-fixture.zip
          E2E_PERF_FIXTURE: /tmp/cloud-arch-icon-browser-preview-performance-fixture.zip
        run: npm run test:e2e
      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  cli-package-smoke:
    name: Packaged CLI smoke (${{ matrix.os }})
    needs: app-change-scope
    if: needs.app-change-scope.outputs.code_changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Parse Office spike PowerShell harness
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'tools/office-spike/powerpoint-interop.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
      - run: npm run test:cli-package-smoke
