name: Release Polish Design Patch

on:
  push:
    branches: [chore/25-v0.2-release-polish]

permissions:
  contents: write

jobs:
  patch-design:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chore/25-v0.2-release-polish

      - name: Align design contract with v0.2 implementation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("DESIGN.md")
          text = path.read_text()

          replacements = [
              (
                  "Status: current design baseline. The first public release, `v0.1.0`, was completed on 2026-09-06 (JST).",
                  "Status: current design baseline. This document tracks current repository behavior; publication/version state is recorded in `README.md`, `CHANGELOG.md`, and `docs/RELEASE.md`.",
              ),
              (
                  "The tool makes a user-downloaded official ZIP easier to navigate, search, preview, and download from without redistributing Microsoft assets.",
                  "The tool makes a user-downloaded official ZIP easier to navigate, search, preview, copy into compatible Office workflows, and download from without redistributing Microsoft assets.",
              ),
              (
                  "- PNG conversion or other asset conversion.",
                  "- Raster download/export formats beyond the transient clipboard PNG copy.",
              ),
              (
                  "Ranking priority:\n\n1. normalized exact display-name match,\n2. display-name prefix match,\n3. display-name substring match,\n4. Fuse fuzzy results.",
                  "Ranking priority:\n\n1. normalized exact match against display name, original filename, or category path,\n2. prefix match against those same fields,\n3. substring match against those same fields,\n4. Fuse fuzzy results.",
              ),
              (
                  "Dark mode follows `prefers-color-scheme`. There is no manual theme switch in the current baseline.",
                  "Theme defaults to `System`, follows `prefers-color-scheme` in that mode, and also supports explicit persisted `Light` and `Dark` selections.",
              ),
              (
                  "Playwright covers the golden path using only project-owned dummy ZIP/SVG fixtures:\n\n1. start the local app,\n2. upload a dummy ZIP,\n3. browse icons/categories,\n4. search,\n5. open the details Dialog,\n6. download an SVG and verify the downloaded bytes,\n7. verify key keyboard/focus behavior.",
                  "Playwright covers the golden path using only project-owned dummy ZIP/SVG fixtures:\n\n1. start the local app and upload a dummy ZIP,\n2. browse All icons and explicit category filters,\n3. search with keyboard autocomplete,\n4. exercise Favorites, Recent, Grid/Compact, theme, and persistence boundaries,\n5. open the centered details Dialog and verify focus/Escape restoration,\n6. verify transparent 512×512 PNG clipboard behavior and denied-permission feedback,\n7. download an SVG and verify the original bytes/filename,\n8. exercise representative narrow/mobile navigation and Dialog containment.",
              ),
              (
                  "- `docs/PAGES_PREVIEW.md`: GitHub Pages UI-preview setup and operational boundary.\n- `LICENSE`: MIT license for project code.",
                  "- `docs/PAGES_PREVIEW.md`: GitHub Pages UI-preview setup and operational boundary.\n- `docs/V0.2.0_VERIFICATION.md`: release-specific `v0.2.0` verification record.\n- `LICENSE`: MIT license for project code.",
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one design marker, found {count}: {old[:80]!r}")
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

          git diff --check

      - name: Commit design alignment
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DESIGN.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs: align design contract with v0.2 behavior"
          git push origin HEAD:chore/25-v0.2-release-polish
