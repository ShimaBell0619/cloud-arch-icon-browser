name: Generate README demo asset

on:
  push:
    branches:
      - docs/readme-demo

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: docs/readme-demo

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies for one-off generation
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Download official Azure Architecture Icons
        run: |
          curl --fail --location --silent --show-error \
            https://arch-center.azureedge.net/icons/Azure_Public_Service_Icons_V24.zip \
            --output /tmp/Azure_Public_Service_Icons_V24.zip

      - name: Record README demo
        env:
          AZURE_ICON_ZIP: /tmp/Azure_Public_Service_Icons_V24.zip
        run: npm run docs:demo

      - name: Commit generated GIF
        run: |
          git restore package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/demo.gif
          git commit -m "docs: add README demo GIF"
          git push origin HEAD:docs/readme-demo
