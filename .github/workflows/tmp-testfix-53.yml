name: Temporary test fix PR 53

on:
  push:
    branches:
      - feat/43-49-stable-origin-zip-reuse

permissions:
  contents: write

jobs:
  fix-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/43-49-stable-origin-zip-reuse
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Update package-picker copy assertion
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/App.test.tsx')
          text = path.read_text()
          old = 'screen.getByText(/processed locally for this session only/i)'
          new = 'screen.getByText(/the package is processed locally/i)'
          if old not in text:
              raise SystemExit('expected assertion not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - run: npx biome check --write src/App.test.tsx
      - run: npm test
      - name: Commit test fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.test.tsx
          git commit -m "test: align package picker copy assertion"
          git push origin HEAD:feat/43-49-stable-origin-zip-reuse
