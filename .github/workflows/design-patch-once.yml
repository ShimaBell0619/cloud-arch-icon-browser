name: Design Contract Sync Once

on:
  push:
    branches: [fix/28-mobile-picker-pr-previews]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/28-mobile-picker-pr-previews
          persist-credentials: true

      - name: Update approved design contract and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('DESIGN.md')
          text = path.read_text()

          replacements = {
              "- Pull requests should validate the Pages-specific Vite build; deployment occurs only from `main` or an explicit maintainer workflow dispatch.":
              "- Pull requests validate a target-specific Pages build. Same-repository PRs also publish to stable `/pr-N/` preview paths, while fork PRs remain build-only.\n- `main` publishes at the site root and preserves active `pr-*` previews; closing or merging a PR removes its preview.",
              "- Initial selection supports drag/drop and file picker.":
              "- Initial selection supports drag/drop and file picker.\n- In secure contexts where `showOpenFilePicker()` is available, package selection may prefer a transient File System Access picker with a ZIP filter; cancellation is silent and unsupported/error cases fall back to the standard file input.\n- A `FileSystemFileHandle` is used only long enough to obtain the current-session `File` and must never be persisted or used to silently reopen a package.",
              "The Pages preview workflow also validates a Vite build using the repository Pages base path on pull requests. Pages deployment is restricted to `main` or an explicit maintainer workflow dispatch.":
              "The Pages preview workflow validates target-specific Vite builds. Same-repository PRs publish to stable `/pr-N/` paths for pre-merge device verification; fork PRs are build-only. `main` remains at the site root, and closing or merging a PR removes its generated preview path.",
          }

          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one DESIGN.md match, got {count}: {old}')
              text = text.replace(old, new)

          path.write_text(text)
          PY

          rm .github/workflows/design-patch-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DESIGN.md .github/workflows/design-patch-once.yml
          git commit -m "docs: align design with mobile picker and PR previews"
          git push origin HEAD:fix/28-mobile-picker-pr-previews
