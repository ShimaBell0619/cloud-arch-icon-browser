name: Combined UX Finalizer

on:
  push:
    branches: [feat/21-24-v0.2-core-ux]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/21-24-v0.2-core-ux

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci
      - run: python3 scripts/finalize-v02-design.py
      - run: python3 scripts/fix-autocomplete-filter-overlap.py
      - run: npx biome check --write src tests/e2e/golden-path.spec.mjs DESIGN.md
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Create project-owned E2E fixture
        run: python3 scripts/ui-review/create_fixture.py /tmp/cloud-arch-icon-browser-e2e-fixture.zip
      - name: Refresh Linux visual baselines
        env:
          E2E_FIXTURE: /tmp/cloud-arch-icon-browser-e2e-fixture.zip
        run: npx playwright test tests/e2e/visual.spec.mjs --update-snapshots
      - name: Run Playwright suite
        env:
          E2E_FIXTURE: /tmp/cloud-arch-icon-browser-e2e-fixture.zip
        run: npx playwright test

      - name: Commit finalized design and baselines
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/components/search-autocomplete.tsx DESIGN.md tests/e2e tests/e2e/visual.spec.mjs-snapshots
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "test: finalize combined v0.2 UX validation"
          git push origin HEAD:feat/21-24-v0.2-core-ux
