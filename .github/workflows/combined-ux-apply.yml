name: Combined UX Finalizer

on:
  push:
    branches: [feat/21-24-v0.2-core-ux]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/21-24-v0.2-core-ux

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci
      - run: python3 scripts/apply-v02-combined.py
      - run: npx biome check --write src/App.tsx src/core/search.ts src/core/search.test.ts src/components/icon-card.tsx src/components/icon-details-dialog.tsx src/components/lazy-icon-preview.tsx src/components/search-autocomplete.tsx src/lib/icon-clipboard.ts src/lib/icon-clipboard.test.ts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Commit transformed app
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/core/search.ts src/core/search.test.ts src/components/icon-card.tsx src/components/icon-details-dialog.tsx src/components/lazy-icon-preview.tsx src/components/search-autocomplete.tsx src/lib/icon-clipboard.ts src/lib/icon-clipboard.test.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat: integrate v0.2 discovery and copy UX"
          git push origin HEAD:feat/21-24-v0.2-core-ux
