name: Issue 5 dependency sync

on:
  push:
    branches: [chore/issue-5-release-readiness]
    paths:
      - ".github/workflows/_issue5-sync-dev-deps.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chore/issue-5-release-readiness
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Add exact release-readiness dev dependencies
        run: npm install --save-dev --save-exact @playwright/test@1.62.1 @axe-core/playwright@4.13.0 @changesets/cli@2.29.7
      - name: Commit lockfile update
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: add release readiness tooling"
          git push origin HEAD:chore/issue-5-release-readiness
