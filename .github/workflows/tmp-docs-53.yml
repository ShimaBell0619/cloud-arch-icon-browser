name: Temporary docs update PR 53

on:
  push:
    branches:
      - feat/43-49-stable-origin-zip-reuse

permissions:
  contents: write

jobs:
  update-docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/43-49-stable-origin-zip-reuse
      - run: python -c "import base64;exec(base64.b64decode(''))"
      - name: Commit docs
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md DESIGN.md
          git commit -m "docs: document stable origin and previous ZIP reuse"
          git push origin HEAD:feat/43-49-stable-origin-zip-reuse
