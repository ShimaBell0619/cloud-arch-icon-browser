name: Temporary docs update PR 53

on:
  push:
    branches:
      - feat/43-49-stable-origin-zip-reuse

permissions:
  contents: write

jobs:
  update-docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/43-49-stable-origin-zip-reuse
      - name: Update runtime and package-handle docs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          design = Path('DESIGN.md')
          text = design.read_text()
          replacements = {
          '''- ZIP/SVG processing stays in the current browser session; selected package contents are not uploaded or persisted by the application.''': '''- ZIP/SVG processing stays local; selected package bytes, extracted SVGs, generated images, and package-session resources are not uploaded or persisted. On supported browsers, a `FileSystemFileHandle` reference may be persisted separately in IndexedDB after successful package validation so the user can reopen the same local file later.''',
          '''- persistence of the selected ZIP, file handle, SVG bodies, generated image data, or package session,''': '''- persistence of the selected ZIP bytes, SVG bodies, generated image data, or package session outside the explicitly approved file-handle metadata boundary,''',
          '''The CLI starts a temporary static server bound only to `127.0.0.1`, selects an available local port, prints the URL, attempts to open the default browser, and stops on `Ctrl+C`. The server supports only static `GET`/`HEAD`, rejects unsafe paths and unexpected Host headers, and returns `405` for mutating methods.''': '''The packaged CLI serves the app from the canonical origin `http://127.0.0.1:41731/`. It never falls back to a random port. If that origin already serves a matching Cloud Arch Icon Browser instance, a second invocation reuses/opens it; if another process owns the port, startup fails with an actionable error. The server remains bound only to `127.0.0.1`, supports only static `GET`/`HEAD`, rejects unsafe paths and unexpected Host headers, returns `405` for mutating methods, attempts to open the default browser, and stops on `Ctrl+C` when this invocation owns the server.''',
          '''- A package is selected explicitly each session; reload returns to the package picker.
- Initial selection supports the normal file input/drag-and-drop path. A transient File System Access picker may be preferred where supported, but its handle must not be persisted.''': '''- Reload returns to the package picker unless a previously remembered local file reference is available; package bytes are never restored from application storage.
- Initial selection supports the normal file input/drag-and-drop path. A File System Access picker may be preferred where supported. Its `FileSystemFileHandle` may be persisted in IndexedDB only after the candidate package has passed normal validation.
- A remembered handle with `prompt` permission is reopened only from an explicit `Open previous ZIP` user gesture; the app must not trigger a permission prompt during passive startup. Granted handles may be read only under normal browser permission rules.
- Denied, stale, moved/deleted, malformed, or inaccessible remembered handles fall back safely to normal package selection. Users can explicitly forget the remembered reference without affecting Favorites or other UI metadata.''',
          '''Never persist ZIP bytes, file handles, SVG/generated image bytes, Blob/Object URLs, readers, or package-session resources.''': '''Never persist ZIP bytes, SVG/generated image bytes, Blob/Object URLs, readers, or package-session resources. `localStorage` never contains file handles.

A separate IndexedDB boundary may store one structured-cloneable `FileSystemFileHandle` for the previously validated package. The handle is a local permission-bearing reference, not a copy of the ZIP. Remembering it is best-effort and must never make package loading depend on IndexedDB availability. A replacement handle is committed only after the replacement package validates successfully.''',
          '''Before loading, show a focused package picker/dropzone. Loading may report phases such as Reading, Validating, and Indexing without fake percentage progress.''': '''Before loading, show a focused package picker/dropzone. When a remembered File System Access handle exists, also expose explicit `Open previous ZIP` and `Forget previous ZIP reference` actions. Browser permission prompts must remain user-gesture driven. Loading may report phases such as Reading, Validating, and Indexing without fake percentage progress.'''
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'DESIGN replacement not found: {old[:80]}')
              text = text.replace(old, new, 1)
          design.write_text(text)

          readme = Path('README.md')
          text = readme.read_text()
          old = '''The command starts a temporary localhost server bound to `127.0.0.1` and opens the app in your default browser. The selected ZIP is processed locally and is not uploaded or persisted by the application.'''
          new = '''The command serves the app from the stable local origin `http://127.0.0.1:41731/` and opens it in your default browser. A second invocation reuses the same running app; if another process occupies that port, the CLI reports an error rather than switching origins. The selected ZIP is processed locally and its bytes are never uploaded or copied into application storage.\n\nOn browsers that support the File System Access API, a successfully validated selection can remember only the local file handle in IndexedDB. A later launch can use `Open previous ZIP` to request/read that file under normal browser permission rules, and `Forget previous ZIP reference` removes the handle. The app does not trigger a file-permission prompt automatically on page load. Unsupported browsers continue to use the normal ZIP picker.'''
          if old not in text:
              raise SystemExit('README runtime paragraph not found')
          text = text.replace(old, new, 1)
          old_feature = '- Local-only package processing with no automatic runtime network access.'
          new_feature = '- Local-only package processing with no automatic runtime network access; supported browsers can remember only a local file reference for the previous ZIP.'
          if old_feature not in text:
              raise SystemExit('README feature bullet not found')
          text = text.replace(old_feature, new_feature, 1)
          readme.write_text(text)
          PY
      - name: Commit docs
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md DESIGN.md
          git commit -m "docs: document stable origin and previous ZIP reuse"
          git push origin HEAD:feat/43-49-stable-origin-zip-reuse
