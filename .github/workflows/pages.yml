name: Pages Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Build Pages preview
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci
      - run: npm run typecheck

      - name: Resolve Pages base path
        id: target
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            echo "base=/cloud-arch-icon-browser/pr-${PR_NUMBER}/" >> "$GITHUB_OUTPUT"
          else
            echo "base=/cloud-arch-icon-browser/" >> "$GITHUB_OUTPUT"
          fi

      - name: Build preview target
        run: npx vite build --base="${{ steps.target.outputs.base }}"

  finalize_issue20:
    name: Finalize issue 20 validation assets
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action != 'closed' &&
      github.event.pull_request.head.ref == 'feat/20-sidebar-workspace-navigation' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/20-sidebar-workspace-navigation

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: Finalize source and design contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app = Path("src/App.tsx")
          text = app.read_text()
          text = text.replace(
              "  expanded?: boolean;\n  trailing?: ReactNode;",
              "  expanded?: boolean | undefined;\n  trailing?: ReactNode | undefined;",
          )
          app.write_text(text)

          design = Path("DESIGN.md")
          text = design.read_text()
          old = '''### 8.6 Loaded layout

Desktop:

- fixed-width left category sidebar,
- sticky search/action toolbar,
- responsive icon grid.

Narrow viewport:

- category navigation becomes a Drawer/Sheet,
- grid adapts without horizontal breakage,
- dialogs fit within the viewport.

Toolbar priority:

1. search,
2. result count,
3. `Change package`.

Loaded ZIP filename/icon count/category count are useful but visually secondary.

### 8.7 Category tree

- Single category selection.
- `All` selected by default after successful load.
- Top-level folders visible initially.
- Child folders collapsed initially.
- Sibling folders alphabetical.
- Clicking category label selects it.
- Chevron controls expand/collapse.

The main icon grid remains flat; it is not grouped by category.
'''
          new = '''### 8.6 Loaded layout

Desktop:

- fixed left workspace sidebar with top-level `All icons`, `Favorites`, `Recent`, and `Categories` destinations,
- sidebar expanded by default and collapsible to a compact icon rail; the collapsed preference persists through the approved UI persistence layer,
- categories expand inside the full sidebar; selecting a category scopes the icon results,
- sticky search-first toolbar,
- responsive icon grid.

`Favorites` and `Recent` may exist as navigation placeholders until their data experience is connected by the dedicated v0.2.0 feature work. Do not duplicate or prematurely render their persistence model in the navigation issue.

Narrow viewport:

- the desktop sidebar/rail is replaced by a navigation Drawer/Sheet,
- the sheet contains the top-level destinations, category tree, secondary package controls, and theme control,
- grid adapts without horizontal breakage,
- dialogs fit within the viewport.

Search remains the dominant workspace control. Result count remains nearby supporting information. Loaded ZIP filename/icon count/category count and `Change package` remain visually secondary in navigation surfaces rather than competing with search.

Theme behavior:

- users can explicitly choose `System`, `Light`, or `Dark`,
- the preference persists through the approved UI persistence layer,
- `System` follows the operating-system color-scheme preference and reacts to changes while the app is open,
- only the preference is persisted; the resolved light/dark value is runtime UI state.

### 8.7 Category tree

- Single category selection.
- The top-level `All icons` workspace destination is selected by default after successful load.
- Top-level folders visible initially when `Categories` is expanded.
- Child folders collapsed initially.
- Sibling folders alphabetical.
- Clicking category label selects it and returns the workspace to icon results scoped to that category.
- Chevron controls expand/collapse.
- The workspace navigation owns the global `All icons` destination; category-tree instances may omit their legacy `All` row to avoid duplicate navigation.

The main icon grid remains flat; it is not grouped by category.
'''
          if old not in text:
              raise SystemExit("DESIGN loaded-layout block not found")
          design.write_text(text.replace(old, new))

          golden = Path("tests/e2e/golden-path.spec.mjs")
          text = golden.read_text()
          marker = '''test("key screens have no automatically detectable WCAG A/AA violations", async ({
  page,
}) => {'''
          addition = '''test("workspace navigation preferences survive reload without reopening the package", async ({
  page,
}) => {
  await loadPackage(page);

  const navigation = page.getByRole("navigation", { name: "Workspace" });
  await expect(
    navigation.getByRole("button", { name: "All icons" }),
  ).toHaveAttribute("aria-current", "page");

  await navigation.getByRole("button", { name: "Favorites" }).click();
  await expect(page.getByRole("heading", { name: "Favorites" })).toBeVisible();
  await navigation.getByRole("button", { name: "Recent" }).click();
  await expect(page.getByRole("heading", { name: "Recent" })).toBeVisible();
  await navigation.getByRole("button", { name: "All icons" }).click();

  await page.getByRole("button", { name: "Collapse sidebar" }).click();
  await expect(
    page.getByRole("button", { name: "Expand sidebar" }),
  ).toBeVisible();
  await page.getByRole("button", { name: "Dark theme" }).click();
  await expect(page.locator("html")).toHaveAttribute("data-theme", "dark");

  const preferences = await page.evaluate(() => {
    const raw = localStorage.getItem("cloud-arch-icon-browser:state");
    return raw ? JSON.parse(raw).preferences : null;
  });
  expect(preferences).toMatchObject({ sidebarCollapsed: true, theme: "dark" });

  await page.reload();
  await expect(page.getByRole("button", { name: "Choose ZIP" })).toBeVisible();
  await expect(page.locator("html")).toHaveAttribute("data-theme", "dark");

  await page.getByLabel("Choose icon package ZIP").setInputFiles(fixture);
  await page.getByRole("searchbox", { name: "Search icons" }).waitFor();
  await expect(
    page.getByRole("button", { name: "Expand sidebar" }),
  ).toBeVisible();
});

'''
          if marker not in text:
              raise SystemExit("golden-path insertion marker not found")
          golden.write_text(text.replace(marker, addition + marker))
          PY

      - name: Format changed text files
        run: npx biome check --write src/App.tsx src/App.test.tsx src/components/category-tree.tsx src/index.css tests/e2e/golden-path.spec.mjs

      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium

      - name: Create project-owned E2E fixture
        run: python3 scripts/ui-review/create_fixture.py /tmp/cloud-arch-icon-browser-e2e-fixture.zip

      - name: Refresh Linux visual baselines
        env:
          E2E_FIXTURE: /tmp/cloud-arch-icon-browser-e2e-fixture.zip
        run: npx playwright test tests/e2e/visual.spec.mjs --update-snapshots

      - name: Run browser golden path
        env:
          E2E_FIXTURE: /tmp/cloud-arch-icon-browser-e2e-fixture.zip
        run: npx playwright test tests/e2e/golden-path.spec.mjs

      - name: Commit finalized files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/App.test.tsx src/components/category-tree.tsx src/index.css DESIGN.md tests/e2e/golden-path.spec.mjs tests/e2e/visual.spec.mjs-snapshots
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "test: finalize sidebar navigation validation"
          git push origin HEAD:feat/20-sidebar-workspace-navigation

  publish:
    name: Publish Pages preview
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.action != 'closed' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: pages-site-publish
      cancel-in-progress: false
    permissions:
      contents: write
      pages: write
      id-token: write
      issues: write
      pull-requests: write
    environment:
      name: ${{ github.event_name == 'pull_request' && 'github-pages-preview' || 'github-pages' }}
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: Resolve publish target
        id: target
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            echo "base=/cloud-arch-icon-browser/pr-${PR_NUMBER}/" >> "$GITHUB_OUTPUT"
            echo "path=pr-${PR_NUMBER}" >> "$GITHUB_OUTPUT"
          else
            echo "base=/cloud-arch-icon-browser/" >> "$GITHUB_OUTPUT"
            echo "path=." >> "$GITHUB_OUTPUT"
          fi

      - name: Build publish target
        run: npx vite build --base="${{ steps.target.outputs.base }}"

      - name: Stage persistent Pages content
        id: stage
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_PATH: ${{ steps.target.outputs.path }}
        run: |
          set -euo pipefail

          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          publish_dir="${RUNNER_TEMP}/pages-content"
          deploy_dir="${RUNNER_TEMP}/pages-deploy"

          if git ls-remote --exit-code "$remote" refs/heads/pages-content >/dev/null 2>&1; then
            git clone --depth 1 --branch pages-content "$remote" "$publish_dir"
          else
            mkdir -p "$publish_dir"
            git -C "$publish_dir" init -b pages-content
          fi

          git -C "$publish_dir" config user.name "github-actions[bot]"
          git -C "$publish_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          bootstrap_main() {
            local main_source="${RUNNER_TEMP}/pages-main-source"
            rm -rf "$main_source"
            git clone --depth 1 --branch main "$remote" "$main_source"
            (
              cd "$main_source"
              npm ci
              npx vite build --base=/cloud-arch-icon-browser/
            )
            find "$publish_dir" -mindepth 1 -maxdepth 1 \
              ! -name .git ! -name 'pr-*' -exec rm -rf {} +
            cp -a "$main_source/dist/." "$publish_dir/"
          }

          if [[ "$TARGET_PATH" != "." && ! -f "$publish_dir/index.html" ]]; then
            bootstrap_main
          fi

          if [[ "$TARGET_PATH" == "." ]]; then
            find "$publish_dir" -mindepth 1 -maxdepth 1 \
              ! -name .git ! -name 'pr-*' -exec rm -rf {} +
            cp -a "$GITHUB_WORKSPACE/dist/." "$publish_dir/"
          else
            rm -rf "$publish_dir/$TARGET_PATH"
            mkdir -p "$publish_dir/$TARGET_PATH"
            cp -a "$GITHUB_WORKSPACE/dist/." "$publish_dir/$TARGET_PATH/"
          fi

          touch "$publish_dir/.nojekyll"
          git -C "$publish_dir" add -A

          if ! git -C "$publish_dir" diff --cached --quiet; then
            git -C "$publish_dir" commit -m "chore(pages): publish ${TARGET_PATH}"
            git -C "$publish_dir" push "$remote" HEAD:pages-content
          fi

          rm -rf "$deploy_dir"
          mkdir -p "$deploy_dir"
          rsync -a --exclude=.git "$publish_dir/" "$deploy_dir/"
          echo "deploy_dir=$deploy_dir" >> "$GITHUB_OUTPUT"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ${{ steps.stage.outputs.deploy_dir }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5

      - name: Upsert PR preview link
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          owner="${GITHUB_REPOSITORY%%/*}"
          repo="${GITHUB_REPOSITORY#*/}"
          preview_url="https://${owner,,}.github.io/${repo}/pr-${PR_NUMBER}/"
          short_sha="${HEAD_SHA:0:7}"
          marker='<!-- pages-preview -->'
          body=$(printf '%s\n### Pages preview\n\n%s\n\nUpdated from `%s`.' "$marker" "$preview_url" "$short_sha")

          comment_id=$(gh api \
            "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --paginate \
            --jq '.[] | select(.body | contains("<!-- pages-preview -->")) | .id' \
            | head -n 1)

          if [[ -n "$comment_id" ]]; then
            gh api --method PATCH \
              "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" \
              -f body="$body" >/dev/null
          else
            gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
              -f body="$body" >/dev/null
          fi

  cleanup:
    name: Remove closed PR preview
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: pages-site-publish
      cancel-in-progress: false
    permissions:
      contents: write
      pages: write
      id-token: write
      issues: write
    environment:
      name: github-pages-preview
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Remove preview from persistent Pages content
        id: cleanup
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          publish_dir="${RUNNER_TEMP}/pages-content"
          deploy_dir="${RUNNER_TEMP}/pages-deploy"

          if ! git ls-remote --exit-code "$remote" refs/heads/pages-content >/dev/null 2>&1; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git clone --depth 1 --branch pages-content "$remote" "$publish_dir"
          git -C "$publish_dir" config user.name "github-actions[bot]"
          git -C "$publish_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          target="pr-${PR_NUMBER}"
          if [[ ! -d "$publish_dir/$target" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          rm -rf "$publish_dir/$target"
          git -C "$publish_dir" add -A
          git -C "$publish_dir" commit -m "chore(pages): remove ${target}"
          git -C "$publish_dir" push "$remote" HEAD:pages-content

          mkdir -p "$deploy_dir"
          rsync -a --exclude=.git "$publish_dir/" "$deploy_dir/"
          echo "deploy_dir=$deploy_dir" >> "$GITHUB_OUTPUT"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Upload Pages artifact
        if: steps.cleanup.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ${{ steps.cleanup.outputs.deploy_dir }}

      - name: Deploy cleaned Pages site
        if: steps.cleanup.outputs.changed == 'true'
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5

      - name: Mark PR preview removed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          comment_id=$(gh api \
            "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --paginate \
            --jq '.[] | select(.body | contains("<!-- pages-preview -->")) | .id' \
            | head -n 1)

          if [[ -z "$comment_id" ]]; then
            exit 0
          fi

          body=$(printf '%s\n### Pages preview\n\nPreview removed because this PR is closed.' '<!-- pages-preview -->')
          gh api --method PATCH \
            "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" \
            -f body="$body" >/dev/null
