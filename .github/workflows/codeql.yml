name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "21 4 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze JavaScript and TypeScript
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect docs-only changes
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
          elif [[ "$EVENT_NAME" == "push" ]]; then
            base="$BEFORE_SHA"
          else
            echo "code_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            echo "code_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          code_changed=false
          while IFS= read -r path; do
            if [[ "$path" == *.md || "$path" == docs/* ]]; then
              continue
            fi
            code_changed=true
            break
          done < <(git diff --name-only "$base" "$HEAD_SHA")

          echo "code_changed=$code_changed" >> "$GITHUB_OUTPUT"

      - name: Docs-only change
        if: steps.changes.outputs.code_changed == 'false'
        run: echo "Documentation-only change detected; CodeQL analysis is not required."

      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        if: steps.changes.outputs.code_changed == 'true'
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        if: steps.changes.outputs.code_changed == 'true'
